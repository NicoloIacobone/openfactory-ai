# Deterministic top-down pick and place (phase 2), object pose known or perceived (phase 3).
# SI units, radians.

# Arm configuration at the start and end of every cycle: between the bins, tool pointing down
# (MoveIt IK 2026-11-10). With the long fingers of D-014 gripper_tcp is 0.24 m above the bin
# floors, the fingertips 0.125 m above the rims.
ready_joints: [-0.3397, -1.8188, 2.0501, -1.8021, -1.5708, -1.9105]

planning:
  pipeline: ompl
  planning_time_s: 5.0
  attempts: 3
  velocity_scaling: 0.3
  acceleration_scaling: 0.3
  position_tolerance: 0.001          # m, tool0 pose goals
  orientation_tolerance: 0.01        # rad
  joint_tolerance: 0.001             # rad, joint goals

cartesian:                           # approach, lift, descend, retreat: straight lines
  velocity_scaling: 0.1
  acceleration_scaling: 0.1
  max_step: 0.005                    # m between interpolated waypoints
  min_fraction: 0.99                 # of the path that must be feasible

grasp:
  approach_distance: 0.10            # m, pre-grasp and retreat above the grasp/place TCP
  lift_height: 0.15                  # m, lift and pre-place above the grasp/place TCP
  floor_clearance: 0.005             # m, fingertips above the surface under the object
  palm_clearance: 0.003              # m, palm above the object top
  preclose_margin: 0.005             # m per finger: first close stops this far from the object
  squeeze_depth: 0.005               # m per finger: close target inside the object (holding force)
  width_tolerance: 0.004             # m: jaw opening (left + right finger) vs object width
  max_effort: 20.0                   # N, GripperCommand max_effort
  settle_s: 0.3                      # s, wait after a gripper action before reading the fingers

place:
  xy: [0.0, 0.0]                     # m, object centre in the output_bin frame (known-pose cycle)
  release_clearance: 0.005           # m, object bottom above the destination floor at release
  # Bin picking (phase 4, D-017): place points in output_bin, used in this order, one object
  # each. The output bin is not observed: the cell keeps what it placed as planning-scene
  # obstacles, grown by `obstacle_padding` because an object shifts when the fingers let go.
  slots: [[0.10, 0.055], [0.10, -0.055], [0.0, 0.055], [0.0, -0.055], [-0.10, 0.055],
          [-0.10, -0.055]]
  obstacle_padding: 0.008            # m, on every side. Measured shift of a released object:
                                     # median 4.5 mm (E-004). More than 10 mm would not leave
                                     # room for the fingers between two place points in the
                                     # worst orientation (test_config.py)

scene:
  object_clearance: 0.002            # m, planning-scene object raised above the floor it rests on

selection:                           # grasp candidates and hard filters (phase 4, D-016)
  cylinder_directions: 8             # finger directions tried on a standing cylinder, over 180 deg
  finger_clearance: 0.003            # m, fingers to the bin walls and to the other objects
  max_feasible: 4                    # MoveIt-checked survivors to rank; the rest is not evaluated
  ik_timeout_s: 0.05                 # s, collision-free IK search for one pre-grasp
  unknown_grasps: true               # phase 5 (D-018): grasp clusters perception cannot name,
                                     # as boxes of their measured footprint and height
  unknown_width_tolerance: 0.008     # m, jaw opening vs the measured width of such a cluster:
                                     # the top view erodes sharp vertices (a standing prism
                                     # measures 3-4 mm narrower); a miss still closes 10 mm
                                     # under it (2 x squeeze_depth)

ranking:                             # order of the feasible candidates (D-016, D-019)
  strategy: learned                  # baseline | uniform_random | learned; learned is the
                                     # default since E-005 (higher pick success than baseline
                                     # on both held-out seeds)
  model: grasp_ranker.json           # learned: model file, relative to this directory
  learned_motion: 0.1                # learned: P(success) minus this times motion / motion_cap
  # baseline score (higher is better)
  confidence: 1.0                    # weight of the perception score of the object, in (0, 1]
  clearance: 0.5                     # weight of the gripper's smallest gap, normalised by its cap
  motion: 0.3                        # weight (subtracted) of the move from ready to the pre-grasp
  clearance_cap: 0.03                # m, gaps above this count the same
  motion_cap: 3.0                    # rad, largest joint displacement that counts

perception:                          # camera-driven picks (phase 3)
  min_score: 0.5                     # hypotheses below this confidence are never picked
  settle_s: 0.5                      # s at ready before asking for a view
  timeout_s: 10.0                    # s waiting for a view newer than that

task:                                # bin-picking loop (phase 4, D-017)
  attempts_per_object: 2.0           # attempt budget of a scene, per object in its first view
  max_consecutive_failures: 3        # the cell gives up after this many failed attempts in a row
  max_attempts_per_object: 2         # failed grasps on one object before it is left alone
  match_radius: 0.02                 # m: same object between two views, or still where it was
  match_angle: 0.26                  # rad: same finger direction (a failed grasp is not repeated)

relay:                               # ring of N arms (phase 6, D-020, D-021)
  # Arms that are not working stand upright above their own base, clear of every bin, camera
  # view and neighbour: only the arm whose turn it is goes to `ready_joints`. With two arms
  # `ready_joints` puts both tools at the same point, the centre of the ring.
  park_joints: [0.0, -1.5707, 0.0, -1.5707, 0.0, 0.0]
  place_margin: 0.045                # m, a place point is free when every object seen in the
                                     # destination bin is this far from it, footprint circle
                                     # to point: the half diagonal of the widest catalog
                                     # object (0.039) and the measured shift of a released
                                     # object (median 4.5 mm, E-004). MoveIt has the last word
  arrival_radius: 0.03               # m, the handed-over object must be seen this close to
                                     # its place point (measured: 95 % within 12 mm, E-004)
  max_consecutive_failures: 6        # failed handovers in a row, over all arms, before the
                                     # loop gives up

timeouts:
  server_s: 10.0                     # waiting for MoveIt / controllers
  action_s: 60.0                     # one planning or execution request
